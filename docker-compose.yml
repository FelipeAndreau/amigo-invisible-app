services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
      network: host
    container_name: amigo-invisible-api
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    environment:
      - APP_ENV=dev
    networks:
      - amigo-invisible-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: amigo-invisible-mobile
    ports:
      - "8081:8081"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    networks:
      - amigo-invisible-net

networks:
  amigo-invisible-net:
    driver: bridge
